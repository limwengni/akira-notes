name: Check-in Tracker

on:
  push:
    branches: [2026]
    paths-ignore:
      - README.md

jobs:
  update-checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update check-in in README
        run: python3 .github/scripts/update_checkin.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update check-in [skip ci]"
          git push
